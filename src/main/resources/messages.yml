  reply-resolved: 'Resolved #<id>: <outcome>.'
  reply-dismissed: 'Dismissed #<id>.'
  reply-reopened: 'Reopened #<id>.'
  reply-busy: '#<id> is changing right now. Try again.'
  reply-cancelled: 'Another plugin on the server stopped that change to #<id>.'
  reply-error: Something went wrong. The details are in the server console.
  reply-rejected-needs-identity: 'Link your Minecraft account first: /koban link in game, then /link here.'
  reply-rejected-already-yours: '#<id> is already yours.'
  reply-rejected-claimed-by-other: '#<id> is claimed by **<staff>**.'
  reply-rejected-not-claimed: '#<id> isn''t claimed.'
  reply-rejected-already-closed: '#<id> is already closed.'
  reply-rejected-not-closed: '#<id> is still open.'
  punish-preview: 'Run **<action>** against **<player>**? This runs as the server console:<newline>```<newline><command><newline>```'
  punish-ran: 'Done. Ran `<command>`'
  punish-failed: 'That didn''t work (<reason>): `<command>`'
