name: release

# Push a tag like v1.0.0 to publish a GitHub release with the plugin jar and its SHA-256.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A tag that disagrees with the pom would publish a jar with the wrong version inside.
      - name: Check the tag matches the pom version
        id: version
        run: |
          version="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the pom version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Full build with tests, including the MySQL suite (Docker is available on this runner).
      - name: Build and test
        run: ./mvnw -B -ntp clean package

      - name: Checksum
        working-directory: target
        run: sha256sum "Koban-${{ steps.version.outputs.version }}.jar" > "Koban-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Publish the release
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "Koban-$VERSION.jar" "Koban-$VERSION.jar.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Koban $VERSION" \
            --generate-notes \
            --verify-tag \
            $prerelease
