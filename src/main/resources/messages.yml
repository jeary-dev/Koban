  cmd-reports: Koban reports
  cmd-open: Open and claimed reports, most urgent first
  cmd-lookup: Every report against a player
  cmd-lookup-player: Minecraft name
  cmd-link: Link your Minecraft account (use /koban link in game to get a code)
  cmd-link-code: The code from /koban link
  open-title: '**<count> open report(s)**'
