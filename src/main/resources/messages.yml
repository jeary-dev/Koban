discord:
  # Forum tags (created by the bot if create-tags is on).
  tag-open: Open
  tag-claimed: Claimed
  tag-resolved: Resolved
  tag-dismissed: Dismissed
  status-open: '🌸 Open'
  status-claimed: '🔖 Claimed by <staff>'
  status-resolved: '✅ Resolved by <staff> · <outcome>'
  status-dismissed: '🍂 Dismissed by <staff>'
  outcome-action: Action taken
  outcome-none: No action needed
  embed-author: 'Report #<id>'
  embed-footer: 'Koban · <notes> note(s) · <uuid>'
  field-status: Status
  field-priority: Priority · reporters
  field-where: Where
  field-categories: Reasons
  field-reporters: Reporters
  field-player: Reported player
  field-chat: Chat
  field-commands: Commands
  field-nearby: Nearby
  state-offline: Had already left the server
  button-claim: Claim
  button-claim-toggle: Claim / unclaim
  button-resolve: Resolve
  button-dismiss: Dismiss
  button-reopen: Reopen
  button-run: Run it
  button-cancel: Cancel
  punish-placeholder: 'Punish…'
  modal-resolve-title: 'Resolve report #{id}'
  modal-dismiss-title: 'Dismiss report #{id}'
  modal-outcome: Outcome
  modal-note: Note for staff (optional)
  modal-reason: Why? (optional, staff only)
  modal-note-placeholder: Reporters never see this.
  # Lines posted in the report's thread. <source> is one of the source-* texts.
  log-merged: '➕ **<reporter>** also reported this (<category>)<details>. Reporters: <count>'
  log-claimed: '🔖 **<staff>** claimed this <source>.'
  log-taken-over: '🔖 **<staff>** took this over <source>.'
  log-unclaimed: '↩️ **<staff>** unclaimed this <source>.'
  log-resolved: '✅ **<staff>** resolved this <source>: <outcome>.<note>'
  log-dismissed: '🍂 **<staff>** dismissed this <source>.<note>'
  log-reopened: '🌸 **<staff>** reopened this <source>.'
  log-note: '📝 **<staff>** <source>:<newline>> <note>'
  log-action: '🔨 **<staff>** ran **<action>**: `<command>`'
  source-game: in game
  source-discord: on Discord
  source-console: from the console
  source-api: through another plugin
  reply-no-permission: 'You need a role with the **<action>** permission for that (see discord.roles in config.yml).'
  reply-wrong-server: This bot only works in the server it was set up for.
  reply-not-found: 'Report #<id> doesn''t exist any more.'
  reply-claimed: 'You claimed #<id>.'
  reply-taken-over: 'You took over #<id>.'
