name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker is available on GitHub's Ubuntu runners, so the MySQL storage suite runs here
      # (it is skipped, with a message, on machines without Docker).
      - name: Build and test
        run: ./mvnw -B -ntp clean package

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: Koban-jar
          path: target/Koban-*.jar
          if-no-files-found: error

  api-latest:
    name: Links against the newest Spigot API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The 26.x API is Java 25 bytecode; Koban itself still compiles to Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile against the newest API
        run: ./mvnw -B -ntp -Papi-latest -DskipTests clean compile
