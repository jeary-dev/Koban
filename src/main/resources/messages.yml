# /koban setup. Each check is one line: ok, problem or info, followed by its text.
setup:
  header: '<prefix> <#f3d1d9>Discord setup check'
  ok: '<#a8c8a0>  ✔ </#a8c8a0>'
  problem: '<#d98c8c>  ✘ </#d98c8c>'
  info: '<#b7a6d9>  • </#b7a6d9>'
  footer: '<#6b5b60>  Step by step guide: docs/discord-setup.md · change config.yml, then /koban reload'
  disabled: '<#c0a0a8>The bot is off. Set discord.enabled: true in config.yml to use it.'
  token-missing: '<#c0a0a8>No token. Paste it into discord.token (or set KOBAN_DISCORD_TOKEN).'
  token-present: '<#c0a0a8>A token is set <#6b5b60>(never shown)'
  state-off: '<#c0a0a8>Not running: <reason>'
  state-connecting: '<#c0a0a8>Still connecting… try again in a few seconds.'
  state-failed: '<#c0a0a8><reason>'
  connected: '<#c0a0a8>Connected as <#f3d1d9><bot></#f3d1d9> to <#f3d1d9><guild></#f3d1d9>'
  channel-forum: '<#c0a0a8>Reports go to the forum <#f3d1d9>#<channel>'
  channel-text: '<#c0a0a8>Reports go to threads in <#f3d1d9>#<channel></#f3d1d9> <#6b5b60>(a forum channel adds status tags)'
  permissions-ok: '<#c0a0a8>The bot has every permission it needs there'
  permissions-missing: '<#c0a0a8>Missing permissions: <#f3d1d9><permissions></#f3d1d9>. Re-invite with the link below or edit the channel.'
  tags-ok: '<#c0a0a8>All forum tags exist'
  tags-missing: '<#c0a0a8>Missing forum tags: <#f3d1d9><tags></#f3d1d9> (give the bot Manage Channels, or add them yourself)'
  roles-none: '<#c0a0a8>No roles in discord.roles: nobody can use the buttons yet'
  roles-ok: '<#c0a0a8>Roles: <#f3d1d9><roles>'
  roles-unknown: '<#c0a0a8>These role IDs don''t exist in the server: <#f3d1d9><roles>'
  notes-on: '<#c0a0a8>Thread messages become notes (Message Content intent is on)'
